        function RummikubGame() {
            const [gameState, setGameState] = useState('setup');
            const [config, setConfig] = useState({ playerCount: 3, character: 'judy' });
            const [showConfig, setShowConfig] = useState(false);
            const [showLogModal, setShowLogModal] = useState(false);
            const [deck, setDeck] = useState([]);
            const [tableMelds, setTableMelds] = useState([]);
            const [players, setPlayers] = useState([]);
            const [turnIndex, setTurnIndex] = useState(0);

            // 交互状态
            const [selectedHandTiles, setSelectedHandTiles] = useState([]);
            const [selectedTableTile, setSelectedTableTile] = useState(null); // { tile, meldIndex, tileIndex }
            const [selectedMeldIndex, setSelectedMeldIndex] = useState(null);
            const [showRules, setShowRules] = useState(false);
            const [notification, setNotification] = useState(null);
            const [logs, setLogs] = useState([]);
            const [winner, setWinner] = useState(null);

            // 拖拽手势状态
            const [dragState, setDragState] = useState(null);
            const dragStartRef = useRef(null);

            // 防误触摸牌确认弹窗
            const [showDrawConfirmModal, setShowDrawConfirmModal] = useState(false);

            // 回合初始快照（重置整回合）
            const [turnSnapshot, setTurnSnapshot] = useState(null);
            
            // 分步撤销栈 (Step-by-Step Undo Stack)
            const [turnActionStack, setTurnActionStack] = useState([]);

            const aiTimeoutRef = useRef(null);

            // 保持最新状态引用的 Refs，防止 Window 事件闭包陈旧
            const tableMeldsRef = useRef(tableMelds);
            tableMeldsRef.current = tableMelds;
            const playersRef = useRef(players);
            playersRef.current = players;
            const turnSnapshotRef = useRef(turnSnapshot);
            turnSnapshotRef.current = turnSnapshot;

            // 锁定人类玩家与当前回合行动者
            const humanIndex = players.findIndex(p => !p.isComputer);
            const humanPlayer = humanIndex !== -1 ? players[humanIndex] : (players[0] || null);
            const humanPlayerRef = useRef(humanPlayer);
            humanPlayerRef.current = humanPlayer;
            const currentPlayer = players[turnIndex] || null;
            const isHumanTurn = currentPlayer && !currentPlayer.isComputer && gameState === 'playing';
            const isHumanTurnRef = useRef(isHumanTurn);
            isHumanTurnRef.current = isHumanTurn;

            // 桌面初始牌集合（用于高亮显示本回合新打出的牌）
            const initialTableTileIds = useMemo(() => {
                if (!turnSnapshot || !turnSnapshot.tableMelds) return new Set();
                return new Set(turnSnapshot.tableMelds.flat().map(t => t.id));
            }, [turnSnapshot]);
            const initialTableTileIdsRef = useRef(initialTableTileIds);
            initialTableTileIdsRef.current = initialTableTileIds;

            const isEntireTableValid = useMemo(() => {
                if (tableMelds.length === 0) return true;
                return tableMelds.every(m => isValidMeld(m));
            }, [tableMelds]);

            const isJokerSelectedOnTable = selectedTableTile && selectedTableTile.tile.isJoker;

            // 实时探测当前选中的百搭是否可由所选手牌合规置换
            const canCurrentJokerBeSubstituted = useMemo(() => {
                if (!isJokerSelectedOnTable || !humanPlayer?.brokenIce || !isHumanTurn) {
                    return false;
                }
                const targetMeld = tableMelds[selectedTableTile.meldIndex];
                if (!targetMeld) return false;

                const joker = selectedTableTile.tile;
                if (joker.jokerType === 'double') {
                    if (selectedHandTiles.length !== 2) return false;
                } else {
                    if (selectedHandTiles.length !== 1) return false;
                }

                return canTileSubstituteJoker(targetMeld, joker, selectedHandTiles);
            }, [isJokerSelectedOnTable, selectedTableTile, selectedHandTiles, tableMelds, humanPlayer, isHumanTurn]);

            const handleTilePointerDown = (e, tile, sourceInfo) => {
                if (!isHumanTurnRef.current) return;
                // 仅响应鼠标左键或触摸事件
                if (e.button !== undefined && e.button !== 0) return;

                dragStartRef.current = {
                    startX: e.clientX,
                    startY: e.clientY,
                    tile,
                    sourceInfo,
                    hasMoved: false
                };
            };

            const executeDrop = (tile, sourceInfo, targetInfo) => {
                if (!targetInfo || !isHumanTurnRef.current || !humanPlayerRef.current) return;
                const currentMelds = JSON.parse(JSON.stringify(tableMeldsRef.current));
                const currentHuman = humanPlayerRef.current;
                const hIdx = playersRef.current.findIndex(p => !p.isComputer);

                // 1. 拖入目标牌组（内部重排或跨组追加/插入）
                if (targetInfo.type === 'meld') {
                    const { meldIndex: tMeldIdx, slotIndex: tSlotIdx } = targetInfo;
                    if (tMeldIdx < 0 || tMeldIdx >= currentMelds.length) return;

                    // 场景 1A：同一牌组内调整位置（解决镜像百搭/长顺组插空问题！）
                    if (sourceInfo.type === 'table' && sourceInfo.meldIndex === tMeldIdx) {
                        const fromIdx = sourceInfo.tileIndex;
                        let toIdx = tSlotIdx;
                        if (fromIdx === toIdx || fromIdx === toIdx - 1) return; // 位置未变

                        recordStepSnapshot();
                        sfx.playTileClick();

                        const meld = [...currentMelds[tMeldIdx]];
                        const [movedTile] = meld.splice(fromIdx, 1);
                        if (fromIdx < toIdx) toIdx--; // 移除自身后修正目标索引
                        meld.splice(toIdx, 0, movedTile);
                        currentMelds[tMeldIdx] = meld;

                        setTableMelds(currentMelds);
                        setSelectedTableTile({ tile: movedTile, meldIndex: tMeldIdx, tileIndex: toIdx });
                        notify(`已将牌块平移至目标位置！`, "info");
                        return;
                    }

                    // 场景 1B：从桌面上其他牌组拖入当前牌组
                    if (sourceInfo.type === 'table' && sourceInfo.meldIndex !== tMeldIdx) {
                        const sMeldIdx = sourceInfo.meldIndex;
                        const sTileIdx = sourceInfo.tileIndex;

                        recordStepSnapshot();
                        sfx.playTileClick();

                        // 从源牌组移除
                        const sourceMeld = currentMelds[sMeldIdx].filter((_, idx) => idx !== sTileIdx);
                        const [movedTile] = currentMelds[sMeldIdx].splice(sTileIdx, 1);

                        // 插入目标牌组
                        const targetMeld = [...currentMelds[tMeldIdx]];
                        targetMeld.splice(tSlotIdx, 0, movedTile);
                        currentMelds[tMeldIdx] = targetMeld;

                        // 过滤清理空牌组
                        const updatedMelds = currentMelds.filter(m => m.length > 0);
                        setTableMelds(updatedMelds);
                        setSelectedTableTile(null);
                        notify(`已成功拖拽移入桌面 #${tMeldIdx + 1} 牌组！`, "info");
                        return;
                    }

                    // 场景 1C：从手牌架直接拖入桌面已有牌组
                    if (sourceInfo.type === 'hand') {
                        if (!currentHuman.brokenIce) {
                            notify("您尚未破冰（首出需≥30点且完全出自手牌），不可拼接桌面公共牌！", "error");
                            return;
                        }

                        recordStepSnapshot();
                        sfx.playTileClick();

                        // 从手牌移除
                        const newRack = currentHuman.rack.filter(t => t.id !== tile.id);
                        const updatedPlayers = [...playersRef.current];
                        updatedPlayers[hIdx] = { ...currentHuman, rack: newRack };

                        // 插入目标牌组
                        const targetMeld = [...currentMelds[tMeldIdx]];
                        targetMeld.splice(tSlotIdx, 0, { ...tile, isRetrieved: false });
                        currentMelds[tMeldIdx] = targetMeld;

                        setTableMelds(currentMelds);
                        setPlayers(updatedPlayers);
                        setSelectedHandTiles([]);
                        notify(`已将手牌拖入桌面 #${tMeldIdx + 1} 牌组！`, "info");
                        return;
                    }
                }

                // 2. 拖入公共牌桌空白区（自成新牌组）
                if (targetInfo.type === 'table-new') {
                    // 从手牌拖入空白区
                    if (sourceInfo.type === 'hand') {
                        recordStepSnapshot();
                        sfx.playSuccess();

                        const newRack = currentHuman.rack.filter(t => t.id !== tile.id);
                        const updatedPlayers = [...playersRef.current];
                        updatedPlayers[hIdx] = { ...currentHuman, rack: newRack };

                        const newMelds = [...currentMelds, [{ ...tile, isRetrieved: false }]];
                        setTableMelds(newMelds);
                        setPlayers(updatedPlayers);
                        setSelectedHandTiles([]);
                        notify(`已将牌块拖放到牌桌，创建了新牌组！`, "info");
                        return;
                    }

                    // 从桌面牌组抽离到空白区
                    if (sourceInfo.type === 'table') {
                        const sMeldIdx = sourceInfo.meldIndex;
                        if (currentMelds[sMeldIdx].length <= 1) return; // 已经是独立单张

                        recordStepSnapshot();
                        sfx.playTileClick();

                        const remainingMeld = currentMelds[sMeldIdx].filter((_, idx) => idx !== sourceInfo.tileIndex);
                        const newMelds = currentMelds.filter((_, idx) => idx !== sMeldIdx);
                        if (remainingMeld.length > 0) {
                            newMelds.splice(sMeldIdx, 0, remainingMeld);
                        }
                        newMelds.push([tile]);

                        setTableMelds(newMelds);
                        setSelectedTableTile(null);
                        notify(`已将牌块拖拽抽离为独立牌组！`, "info");
                        return;
                    }
                }

                // 3. 拖回底部手牌架（撤回手牌）
                if (targetInfo.type === 'rack') {
                    if (sourceInfo.type === 'table') {
                        const initialIds = initialTableTileIdsRef.current;
                        if (initialIds && initialIds.has(tile.id)) {
                            notify("桌面原本已有的公共牌不可直接收回手牌架！", "error");
                            return;
                        }

                        recordStepSnapshot();
                        sfx.playUndo();

                        const sMeldIdx = sourceInfo.meldIndex;
                        const filteredMeld = currentMelds[sMeldIdx].filter((_, idx) => idx !== sourceInfo.tileIndex);
                        const newMelds = currentMelds.filter((_, idx) => idx !== sMeldIdx);
                        if (filteredMeld.length > 0) {
                            newMelds.splice(sMeldIdx, 0, filteredMeld);
                        }

                        const newRack = [...currentHuman.rack, tile];
                        const updatedPlayers = [...playersRef.current];
                        updatedPlayers[hIdx] = { ...currentHuman, rack: newRack };

                        setTableMelds(newMelds);
                        setPlayers(updatedPlayers);
                        setSelectedTableTile(null);
                        notify(`已将牌块拖回手牌架！`, "info");
                        return;
                    }
                }
            };

            // 全局 Pointer 监听（确保划出屏幕边缘时拖拽不断触）
            useEffect(() => {
                const handlePointerMove = (e) => {
                    if (!dragStartRef.current) return;
                    const { startX, startY, tile, sourceInfo, hasMoved } = dragStartRef.current;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;

                    if (!hasMoved && Math.hypot(dx, dy) > 5) {
                        dragStartRef.current.hasMoved = true;
                    }

                    if (dragStartRef.current.hasMoved) {
                        // 寻找指针下方的落位目标
                        let targetInfo = null;
                        const elUnder = document.elementFromPoint(e.clientX, e.clientY);
                        if (elUnder) {
                            const tileEl = elUnder.closest('[data-meld-tile="true"]');
                            const meldEl = elUnder.closest('[data-meld-group="true"]');
                            const rackEl = elUnder.closest('[data-rack-zone="true"]');
                            const tableAreaEl = elUnder.closest('[data-table-area="true"]');

                            if (tileEl && meldEl) {
                                const mIdx = parseInt(meldEl.dataset.meldIndex, 10);
                                const tIdx = parseInt(tileEl.dataset.tileIndex, 10);
                                const rect = tileEl.getBoundingClientRect();
                                const isAfter = e.clientX > (rect.left + rect.width / 2);
                                targetInfo = { type: 'meld', meldIndex: mIdx, slotIndex: isAfter ? tIdx + 1 : tIdx };
                            } else if (meldEl) {
                                const mIdx = parseInt(meldEl.dataset.meldIndex, 10);
                                const meldLen = tableMeldsRef.current[mIdx]?.length || 0;
                                targetInfo = { type: 'meld', meldIndex: mIdx, slotIndex: meldLen };
                            } else if (rackEl) {
                                targetInfo = { type: 'rack' };
                            } else if (tableAreaEl) {
                                targetInfo = { type: 'table-new' };
                            }
                        }

                        setDragState({
                            tile,
                            sourceInfo,
                            x: e.clientX,
                            y: e.clientY,
                            isDragging: true,
                            targetInfo
                        });
                    }
                };

                const handlePointerUp = (e) => {
                    if (!dragStartRef.current) return;
                    const { tile, sourceInfo, hasMoved } = dragStartRef.current;
                    const lastTargetInfo = dragState?.targetInfo || null;

                    dragStartRef.current = null;
                    setDragState(null);

                    if (hasMoved) {
                        executeDrop(tile, sourceInfo, lastTargetInfo);
                    }
                };

                window.addEventListener('pointermove', handlePointerMove, { passive: true });
                window.addEventListener('pointerup', handlePointerUp);
                window.addEventListener('pointercancel', handlePointerUp);

                return () => {
                    window.removeEventListener('pointermove', handlePointerMove);
                    window.removeEventListener('pointerup', handlePointerUp);
                    window.removeEventListener('pointercancel', handlePointerUp);
                };
            }, [dragState]);

            useEffect(() => {
                return () => {
                    if (aiTimeoutRef.current) clearTimeout(aiTimeoutRef.current);
                };
            }, []);

            const notify = (msg, type = 'info') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3600);
            };

            const addLog = (msg) => {
                setLogs(prev => [...prev, msg].slice(-40));
            };

            const recordStepSnapshot = () => {
                setTurnActionStack(prev => [
                    ...prev,
                    {
                        tableMelds: JSON.parse(JSON.stringify(tableMelds)),
                        playerRack: JSON.parse(JSON.stringify(humanPlayer.rack))
                    }
                ]);
            };

            const undoLastStep = () => {
                if (!isHumanTurn || !humanPlayer) return;
                if (turnActionStack.length === 0) {
                    notify("当前回合暂无出牌操作可撤销", "warning");
                    return;
                }

                sfx.playUndo();
                const lastState = turnActionStack[turnActionStack.length - 1];
                setTableMelds(JSON.parse(JSON.stringify(lastState.tableMelds)));

                const updatedPlayers = [...players];
                updatedPlayers[humanIndex].rack = JSON.parse(JSON.stringify(lastState.playerRack));
                setPlayers(updatedPlayers);

                setTurnActionStack(prev => prev.slice(0, -1));
                setSelectedHandTiles([]);
                setSelectedTableTile(null);
                setSelectedMeldIndex(null);
                notify("↩️ 已撤销上一步操作！", "info");
            };

            const resetCurrentTurn = () => {
                if (!turnSnapshot || !isHumanTurn || !humanPlayer) return;
                sfx.playDraw();
                setTableMelds(JSON.parse(JSON.stringify(turnSnapshot.tableMelds)));
                const updatedPlayers = [...players];
                updatedPlayers[humanIndex].rack = [...turnSnapshot.playerRack];
                setPlayers(updatedPlayers);
                setTurnActionStack([]);
                setSelectedHandTiles([]);
                setSelectedTableTile(null);
                setSelectedMeldIndex(null);
                notify("已恢复至本回合开始前的初始状态", "info");
            };

            const startNewMatch = (cfg = config) => {
                if (aiTimeoutRef.current) {
                    clearTimeout(aiTimeoutRef.current);
                    aiTimeoutRef.current = null;
                }

                const fullDeck = generateDeluxeDeck();
                const humanChar = cfg.character === 'nick' 
                    ? { name: "Nick Wilde", avatar: "🦊", isComputer: false } 
                    : { name: "Judy Hopps", avatar: "🐰", isComputer: false };

                const botRoster = [
                    cfg.character === 'nick' ? { name: "Judy Hopps", avatar: "🐰" } : { name: "Nick Wilde", avatar: "🦊" },
                    { name: "Chief Bogo", avatar: "🐃" },
                    { name: "Flash Sloth", avatar: "🦥" }
                ];

                const newPlayers = [
                    { id: 0, ...humanChar, rack: [], brokenIce: false }
                ];

                for (let i = 1; i < cfg.playerCount; i++) {
                    const bot = botRoster[i - 1];
                    newPlayers.push({
                        id: i,
                        name: bot.name,
                        avatar: bot.avatar,
                        isComputer: true,
                        rack: [],
                        brokenIce: false
                    });
                }

                // 发牌：每位玩家 14 张
                newPlayers.forEach(p => {
                    p.rack = fullDeck.splice(0, 14);
                });

                setDeck(fullDeck);
                setTableMelds([]);
                setPlayers(newPlayers);
                setTurnIndex(0);
                setSelectedHandTiles([]);
                setSelectedTableTile(null);
                setSelectedMeldIndex(null);
                setTurnActionStack([]);
                setWinner(null);
                setGameState('playing');
                setShowConfig(false);

                setTurnSnapshot({
                    tableMelds: [],
                    playerRack: [...newPlayers[0].rack],
                    deckCount: fullDeck.length
                });

                setLogs([`开局成功！豪华 Twist 典藏版，${cfg.playerCount} 人对局，每人底牌 14 张。`]);
                notify(`轮到你的回合 (${humanChar.name})，请破冰出牌 (≥30点) 或摸牌！`, "info");
            };

            // 牌组内部微调：左移 / 右移
            const moveTileInsideMeld = (meldIdx, tileIdx, direction) => {
                if (!isHumanTurn) return;
                const targetIdx = tileIdx + direction;
                const meld = [...tableMelds[meldIdx]];
                if (targetIdx < 0 || targetIdx >= meld.length) return;

                recordStepSnapshot();
                sfx.playTileClick();

                const temp = meld[tileIdx];
                meld[tileIdx] = meld[targetIdx];
                meld[targetIdx] = temp;

                const newMelds = [...tableMelds];
                newMelds[meldIdx] = meld;
                setTableMelds(newMelds);
                setSelectedTableTile({ tile: temp, meldIndex: meldIdx, tileIndex: targetIdx });
            };

            const provideMoveHint = () => {
                if (!isHumanTurn || !humanPlayer) return;
                sfx.playHint();

                const rack = [...humanPlayer.rack];
                const allCandidates = findAllCandidateMelds(rack);

                // 1. 未破冰情况的提示 (需凑足 ≥ 30 点纯手牌组合)
                if (!humanPlayer.brokenIce) {
                    const solution = findDisjointMelds(allCandidates, 30);
                    if (solution.points >= 30 && solution.melds.length > 0) {
                        const flatTiles = solution.melds.flat();
                        setSelectedHandTiles(flatTiles);
                        notify(`💡 破冰提示：已为您自动选中 ${solution.melds.length} 套组合，共 ${solution.points} 点 (≥30点)！点击右侧「作为新牌组打出」即可破冰！`, "info");
                        return;
                    }

                    const bestTry = findDisjointMelds(allCandidates, 0);
                    notify(`💡 破冰提示：当前手牌最高组合点数仅为 ${bestTry.points} 点 (需 ≥ 30 点)，暂无法合规破冰，建议点击「摸牌放弃」。`, "warning");
                    return;
                }

                // 2. 已破冰情况下的出牌提示
                if (allCandidates.length > 0) {
                    const best = [...allCandidates].sort((a, b) => getMeldPoints(b) - getMeldPoints(a))[0];
                    setSelectedHandTiles(best);
                    notify(`💡 出牌提示：手牌可组成新组合 [${best.map(t => t.isJoker ? '百搭' : t.value).join('-')}]！已为您自动选中，点击右侧「打出」即可。`, "info");
                    return;
                }

                // 追加到桌面上已有的牌组中
                for (let mIdx = 0; mIdx < tableMelds.length; mIdx++) {
                    const meld = tableMelds[mIdx];
                    for (const tile of rack) {
                        const newMeld = tryInsertTileIntoMeld(meld, tile);
                        if (newMeld) {
                            setSelectedHandTiles([tile]);
                            setSelectedMeldIndex(mIdx);
                            notify(`💡 追加提示：手中的 [${tile.isJoker ? '百搭' : tile.value}号牌] 可以合规拼接到桌面 #${mIdx + 1} 牌组！已选中该牌和目标牌组。`, "info");
                            return;
                        }
                    }
                }

                // 检查是否能严格等价置换桌面百搭
                for (let mIdx = 0; mIdx < tableMelds.length; mIdx++) {
                    const meld = tableMelds[mIdx];
                    for (const t of meld) {
                        if (t.isJoker) {
                            if (t.jokerType === 'double') {
                                for (let i = 0; i < rack.length; i++) {
                                    for (let j = i + 1; j < rack.length; j++) {
                                        if (canTileSubstituteJoker(meld, t, [rack[i], rack[j]])) {
                                            setSelectedHandTiles([rack[i], rack[j]]);
                                            setSelectedTableTile({ tile: t, meldIndex: mIdx, tileIndex: meld.indexOf(t) });
                                            notify(`💡 置换提示：您手中的 2 张牌可以置换桌面 #${mIdx + 1} 的双重百搭！已为您高亮选中。`, "info");
                                            return;
                                        }
                                    }
                                }
                            } else {
                                for (const handTile of rack) {
                                    if (canTileSubstituteJoker(meld, t, [handTile])) {
                                        setSelectedHandTiles([handTile]);
                                        setSelectedTableTile({ tile: t, meldIndex: mIdx, tileIndex: meld.indexOf(t) });
                                        notify(`💡 置换提示：您手中的 [${TILE_COLORS[handTile.color]?.name || ''}${handTile.value}] 可以严格等价置换桌面 #${mIdx + 1} 的百搭牌！已为您高亮选中。`, "info");
                                        return;
                                    }
                                }
                            }
                        }
                    }
                }

                notify("💡 提示：当前手牌暂无可直接拼出的合法牌组，建议点击「摸牌放弃」摸一张牌。", "warning");
            };

            const smartGroupForBeginners = () => {
                sfx.playSuccess();
                if (!humanPlayer) return;

                const rack = [...humanPlayer.rack];
                const matchedSet = [];
                const matchedIds = new Set();

                const valMap = {};
                rack.forEach(t => {
                    if (!t.isJoker) {
                        if (!valMap[t.value]) valMap[t.value] = [];
                        if (!valMap[t.value].some(x => x.color === t.color)) {
                            valMap[t.value].push(t);
                        }
                    }
                });

                for (const v in valMap) {
                    if (valMap[v].length >= 3) {
                        const group = valMap[v].slice(0, 4);
                        matchedSet.push(...group);
                        group.forEach(t => matchedIds.add(t.id));
                    }
                }

                const remaining = rack.filter(t => !matchedIds.has(t.id));
                const colorMap = { black: [], blue: [], red: [], amber: [] };
                remaining.forEach(t => { if (!t.isJoker) colorMap[t.color].push(t); });

                for (const c in colorMap) {
                    const sorted = colorMap[c].sort((a, b) => a.value - b.value);
                    const unique = [];
                    sorted.forEach(t => {
                        if (!unique.some(x => x.value === t.value)) unique.push(t);
                    });

                    let i = 0;
                    while (i <= unique.length - 3) {
                        if (unique[i+1].value === unique[i].value + 1 && unique[i+2].value === unique[i].value + 2) {
                            const run = [unique[i], unique[i+1], unique[i+2]];
                            let nextIdx = i + 3;
                            while (nextIdx < unique.length && unique[nextIdx].value === unique[nextIdx-1].value + 1) {
                                run.push(unique[nextIdx]);
                                nextIdx++;
                            }
                            matchedSet.push(...run);
                            run.forEach(t => matchedIds.add(t.id));
                            i = nextIdx;
                        } else {
                            i++;
                        }
                    }
                }

                const leftovers = rack.filter(t => !matchedIds.has(t.id));
                const newRackOrder = [...matchedSet, ...leftovers];

                const updatedPlayers = [...players];
                updatedPlayers[humanIndex].rack = newRackOrder;
                setPlayers(updatedPlayers);

                if (matchedSet.length > 0) {
                    notify(`💡 智能理牌完成！已为您整理好 ${matchedSet.length} 张顺/群组手牌并置于上排！`, "info");
                    addLog(`💡 智能理牌帮 ${humanPlayer.name} 整理出成组手牌！`);
                } else {
                    notify("手牌中暂未识别到天然成套的3张顺/群组，建议摸牌或搭配百搭牌！", "warning");
                }
            };

            const sortRackByNumber = () => {
                if (!humanPlayer) return;
                sfx.playTileClick();
                const updatedPlayers = [...players];
                const rack = [...updatedPlayers[humanIndex].rack];
                rack.sort((a, b) => {
                    if (a.isJoker) return 1;
                    if (b.isJoker) return -1;
                    if (a.value !== b.value) return a.value - b.value;
                    return a.color.localeCompare(b.color);
                });
                updatedPlayers[humanIndex].rack = rack;
                setPlayers(updatedPlayers);
            };

            const sortRackByColor = () => {
                if (!humanPlayer) return;
                sfx.playTileClick();
                const updatedPlayers = [...players];
                const rack = [...updatedPlayers[humanIndex].rack];
                rack.sort((a, b) => {
                    if (a.isJoker) return 1;
                    if (b.isJoker) return -1;
                    if (a.color !== b.color) return a.color.localeCompare(b.color);
                    return a.value - b.value;
                });
                updatedPlayers[humanIndex].rack = rack;
                setPlayers(updatedPlayers);
            };

            const toggleSelectHandTile = (tile) => {
                if (!isHumanTurn) {
                    notify("请等待轮到你的回合再选择手牌！", "warning");
                    return;
                }
                sfx.playTileClick();
                if (selectedHandTiles.some(t => t.id === tile.id)) {
                    setSelectedHandTiles(selectedHandTiles.filter(t => t.id !== tile.id));
                } else {
                    setSelectedHandTiles([...selectedHandTiles, tile]);
                }
            };

            const playSelectedAsNewMeld = () => {
                if (!isHumanTurn || !humanPlayer) return;
                if (selectedHandTiles.length === 0) {
                    notify("请先在牌架中点击选择要打出的牌！", "warning");
                    return;
                }

                const sortedNewMeld = sortMeldSmart(selectedHandTiles);

                if (!humanPlayer.brokenIce) {
                    if (!isValidMeld(sortedNewMeld)) {
                        notify("破冰首出牌组必须是合法的顺组或群组！", "error");
                        return;
                    }
                }

                recordStepSnapshot();
                sfx.playSuccess();

                const ids = new Set(selectedHandTiles.map(t => t.id));
                const newRack = humanPlayer.rack.filter(t => !ids.has(t.id));
                const newMelds = [...tableMelds, sortedNewMeld.map(t => ({ ...t, isRetrieved: false }))];

                const updatedPlayers = [...players];
                updatedPlayers[humanIndex] = { ...humanPlayer, rack: newRack };

                setTableMelds(newMelds);
                setPlayers(updatedPlayers);
                setSelectedHandTiles([]);
                notify("新牌组已推上桌面！已高亮标记", "info");
            };

            const appendSelectedToMeld = (meldIdx) => {
                if (!isHumanTurn || !humanPlayer) return;
                if (selectedHandTiles.length === 0) {
                    if (selectedTableTile) {
                        recordStepSnapshot();
                        moveTileBetweenMelds(selectedTableTile, meldIdx);
                    } else if (selectedMeldIndex !== null && selectedMeldIndex !== meldIdx) {
                        recordStepSnapshot();
                        sfx.playTileClick();
                        const newMelds = [...tableMelds];
                        const fromMeld = newMelds[selectedMeldIndex];
                        const toMeld = newMelds[meldIdx];
                        const merged = sortMeldSmart([...toMeld, ...fromMeld]);
                        newMelds[meldIdx] = merged;
                        newMelds.splice(selectedMeldIndex, 1);
                        setTableMelds(newMelds);
                        setSelectedMeldIndex(null);
                        notify(`已将牌组 #${selectedMeldIndex + 1} 合并入牌组 #${meldIdx + 1}！`, "info");
                    } else {
                        setSelectedMeldIndex(meldIdx === selectedMeldIndex ? null : meldIdx);
                    }
                    return;
                }

                if (!humanPlayer.brokenIce) {
                    notify("您尚未破冰（首出需≥30点且完全出自手牌），不可拼接桌面公共牌！", "error");
                    return;
                }

                const currentMeld = [...tableMelds[meldIdx]];
                let nextMeld = tryInsertBatchIntoMeld(currentMeld, selectedHandTiles);

                if (!nextMeld) {
                    nextMeld = sortMeldSmart([...currentMeld, ...selectedHandTiles]);
                }

                recordStepSnapshot();
                sfx.playTileClick();

                const ids = new Set(selectedHandTiles.map(t => t.id));
                const newRack = humanPlayer.rack.filter(t => !ids.has(t.id));

                const newMelds = [...tableMelds];
                newMelds[meldIdx] = nextMeld.map(t => ({ ...t, isRetrieved: false }));

                const updatedPlayers = [...players];
                updatedPlayers[humanIndex] = { ...humanPlayer, rack: newRack };

                setTableMelds(newMelds);
                setPlayers(updatedPlayers);
                setSelectedHandTiles([]);
                notify(`已拼入桌面 #${meldIdx + 1} 牌组！已高亮标记`, "info");
            };

            const substituteTableJoker = () => {
                if (!isHumanTurn || !humanPlayer) return;
                if (!selectedTableTile || !selectedTableTile.tile.isJoker) {
                    notify("请先在牌桌上点击选中要置换的百搭牌！", "warning");
                    return;
                }

                if (!humanPlayer.brokenIce) {
                    notify("您尚未破冰，必须先依靠纯手牌出满 ≥ 30 点，不能置换桌上百搭！", "error");
                    return;
                }

                const { tile: jokerTile, meldIndex } = selectedTableTile;
                const targetMeld = tableMelds[meldIndex];

                if (!canTileSubstituteJoker(targetMeld, jokerTile, selectedHandTiles)) {
                    if (jokerTile.jokerType === 'double') {
                        notify("双重百搭置换失败：必须同时选中它代表的 2 张手牌（例如黑7与黑8）！", "error");
                    } else {
                        notify("该手牌无法等价替换此百搭（必须完全匹配该百搭代表的颜色与数值）！", "error");
                    }
                    return;
                }

                recordStepSnapshot();
                sfx.playSuccess();

                const jokerIdx = targetMeld.findIndex(t => t.id === jokerTile.id);
                let updatedMeld = [];

                if (jokerTile.jokerType === 'double') {
                    const [h1, h2] = selectedHandTiles;
                    const opt1 = [...targetMeld.slice(0, jokerIdx), h1, h2, ...targetMeld.slice(jokerIdx + 1)];
                    if (isValidMeld(opt1)) {
                        updatedMeld = opt1;
                    } else {
                        updatedMeld = [...targetMeld.slice(0, jokerIdx), h2, h1, ...targetMeld.slice(jokerIdx + 1)];
                    }
                } else {
                    const handTile = selectedHandTiles[0];
                    updatedMeld = targetMeld.map(t => (t.id === jokerTile.id ? handTile : t));
                }

                const newMelds = [...tableMelds];
                newMelds[meldIndex] = updatedMeld;

                const usedHandIds = new Set(selectedHandTiles.map(t => t.id));
                const newRack = humanPlayer.rack.filter(t => !usedHandIds.has(t.id));
                newRack.push({ ...jokerTile, isRetrieved: true });

                const updatedPlayers = [...players];
                updatedPlayers[humanIndex] = { ...humanPlayer, rack: newRack };

                setTableMelds(newMelds);
                setPlayers(updatedPlayers);
                setSelectedHandTiles([]);
                setSelectedTableTile(null);

                notify(`⭐ 成功置换出${jokerTile.jokerType === 'double' ? '双重' : ''}百搭牌！注意：本回合必须立即打出！`, "info");
                addLog(`🔄 ${humanPlayer.name} 成功置换了桌面 #${meldIndex + 1} 牌组的百搭牌！`);
            };

            const splitMeldAtSelectedTile = () => {
                if (!isHumanTurn) return;
                if (!selectedTableTile) return;
                const { tile, meldIndex } = selectedTableTile;
                const meld = tableMelds[meldIndex];
                const splitIdx = meld.findIndex(t => t.id === tile.id);

                if (splitIdx <= 0 || splitIdx >= meld.length) {
                    notify("不能在边缘处拆分牌组，请点击中间的某张牌进行切断！", "warning");
                    return;
                }

                recordStepSnapshot();
                sfx.playTileClick();

                const partA = meld.slice(0, splitIdx);
                const partB = meld.slice(splitIdx);

                const newMelds = [...tableMelds.slice(0, meldIndex), partA, partB, ...tableMelds.slice(meldIndex + 1)];
                setTableMelds(newMelds);
                setSelectedTableTile(null);
                notify(`✂️ 已成功将牌组拆分为两组！`, "info");
                addLog(`✂️ ${humanPlayer.name} 拆分了桌面 #${meldIndex + 1} 牌组`);
            };

            const extractTileToNewMeld = () => {
                if (!isHumanTurn) return;
                if (!selectedTableTile) return;
                const { tile, meldIndex } = selectedTableTile;
                const meld = tableMelds[meldIndex];

                recordStepSnapshot();
                sfx.playTileClick();

                const remainingMeld = meld.filter(t => t.id !== tile.id);
                const newMelds = tableMelds.filter((_, idx) => idx !== meldIndex);
                if (remainingMeld.length > 0) {
                    newMelds.splice(meldIndex, 0, remainingMeld);
                }
                newMelds.push([tile]);

                setTableMelds(newMelds);
                setSelectedTableTile(null);
                notify(`📤 已抽离牌块 [${tile.isJoker ? '百搭' : tile.value}]，可自由拼接！`, "info");
            };

            const handleTableTileClick = (tile, meldIndex, tileIndex) => {
                if (!isHumanTurn) {
                    notify("当前是其他玩家的回合，请等待轮到你！", "warning");
                    return;
                }
                sfx.playTileClick();
                if (!humanPlayer.brokenIce) {
                    notify("未破冰玩家无法移动桌面的公共牌！", "warning");
                    return;
                }

                if (!selectedTableTile) {
                    setSelectedTableTile({ tile, meldIndex, tileIndex });
                } else {
                    if (selectedTableTile.tile.id === tile.id) {
                        setSelectedTableTile(null);
                    } else {
                        setSelectedTableTile({ tile, meldIndex, tileIndex });
                    }
                }
            };

            const moveTileBetweenMelds = (source, targetMeldIdx) => {
                if (!isHumanTurn) return;
                if (source.meldIndex === targetMeldIdx) {
                    setSelectedTableTile(null);
                    return;
                }
                recordStepSnapshot();
                const newMelds = [...tableMelds];
                const fromMeld = newMelds[source.meldIndex].filter(t => t.id !== source.tile.id);
                
                const targetMeld = [...newMelds[targetMeldIdx], source.tile];
                const sortedTargetMeld = sortMeldSmart(targetMeld);

                newMelds[source.meldIndex] = fromMeld;
                newMelds[targetMeldIdx] = sortedTargetMeld;

                const filtered = newMelds.filter(m => m.length > 0);
                setTableMelds(filtered);
                setSelectedTableTile(null);
                sfx.playTileClick();
                notify("已将牌块移入目标牌组并自动理顺！", "info");
            };

            const autoMergeLooseTiles = () => {
                if (!isHumanTurn || !humanPlayer?.brokenIce) return;
                const looseIndices = [];
                const looseTiles = [];
                tableMelds.forEach((m, idx) => {
                    if (m.length < 3 || !isValidMeld(m)) {
                        looseIndices.push(idx);
                        looseTiles.push(...m);
                    }
                });

                if (looseTiles.length === 0) {
                    notify("桌面上暂无待合并的零散牌组！", "info");
                    return;
                }

                recordStepSnapshot();
                sfx.playSuccess();

                const remainingMelds = tableMelds.filter((_, idx) => !looseIndices.includes(idx));
                const newlyFormedMelds = [];
                let unassignedTiles = [];

                // 1. 同色顺组归纳
                const colorGroups = { black: [], blue: [], red: [], amber: [] };
                const jokers = [];
                looseTiles.forEach(t => {
                    if (t.isJoker) jokers.push(t);
                    else colorGroups[t.color].push(t);
                });

                for (const color in colorGroups) {
                    const arr = colorGroups[color].sort((a, b) => a.value - b.value);
                    let currentRun = [];
                    for (let i = 0; i < arr.length; i++) {
                        if (currentRun.length === 0) {
                            currentRun.push(arr[i]);
                        } else {
                            const last = currentRun[currentRun.length - 1];
                            if (arr[i].value === last.value + 1) {
                                currentRun.push(arr[i]);
                            } else if (arr[i].value === last.value) {
                                unassignedTiles.push(arr[i]);
                            } else {
                                if (currentRun.length >= 3) {
                                    newlyFormedMelds.push(currentRun);
                                } else {
                                    unassignedTiles.push(...currentRun);
                                }
                                currentRun = [arr[i]];
                            }
                        }
                    }
                    if (currentRun.length >= 3) {
                        newlyFormedMelds.push(currentRun);
                    } else {
                        unassignedTiles.push(...currentRun);
                    }
                }

                // 2. 同数字群组归纳
                const valGroups = {};
                unassignedTiles.forEach(t => {
                    if (!valGroups[t.value]) valGroups[t.value] = [];
                    if (!valGroups[t.value].some(x => x.color === t.color)) {
                        valGroups[t.value].push(t);
                    }
                });

                for (const v in valGroups) {
                    if (valGroups[v].length >= 3) {
                        newlyFormedMelds.push(valGroups[v]);
                        const usedIds = new Set(valGroups[v].map(x => x.id));
                        unassignedTiles = unassignedTiles.filter(t => !usedIds.has(t.id));
                    }
                }

                // 3. 尝试将散牌拼接进已有合法牌组
                const leftovers = [...unassignedTiles, ...jokers];
                const finalLeftovers = [];
                for (const tile of leftovers) {
                    let inserted = false;
                    for (let i = 0; i < remainingMelds.length; i++) {
                        const test = tryInsertTileIntoMeld(remainingMelds[i], tile);
                        if (test) {
                            remainingMelds[i] = test;
                            inserted = true;
                            break;
                        }
                    }
                    if (!inserted) {
                        for (let i = 0; i < newlyFormedMelds.length; i++) {
                            const test = tryInsertTileIntoMeld(newlyFormedMelds[i], tile);
                            if (test) {
                                newlyFormedMelds[i] = test;
                                inserted = true;
                                break;
                            }
                        }
                    }
                    if (!inserted) finalLeftovers.push(tile);
                }

                // 4. 余下的零碎牌按颜色归拢，方便玩家后续继续出牌
                if (finalLeftovers.length > 0) {
                    const byCol = {};
                    finalLeftovers.forEach(t => {
                        const k = t.color || 'joker';
                        if (!byCol[k]) byCol[k] = [];
                        byCol[k].push(t);
                    });
                    for (const k in byCol) {
                        newlyFormedMelds.push(sortMeldSmart(byCol[k]));
                    }
                }

                setTableMelds([...remainingMelds, ...newlyFormedMelds]);
                setSelectedTableTile(null);
                setSelectedMeldIndex(null);
                notify("⚡ 桌面零散牌已智能合并归拢！", "info");
                addLog(`⚡ ${humanPlayer.name} 智能合并了桌面上的零散牌块！`);
            };

            const takeBackToHand = () => {
                if (!isHumanTurn || !selectedTableTile || !turnSnapshot || !humanPlayer) return;
                const { tile, meldIndex } = selectedTableTile;
                const initialIds = new Set(turnSnapshot.tableMelds.flat().map(t => t.id));
                if (initialIds.has(tile.id)) {
                    notify("桌面原本已有的公共牌不可直接收回手牌架！", "error");
                    return;
                }

                recordStepSnapshot();
                const newMelds = [...tableMelds];
                newMelds[meldIndex] = newMelds[meldIndex].filter(t => t.id !== tile.id);
                const filtered = newMelds.filter(m => m.length > 0);

                const newRack = [...humanPlayer.rack, tile];
                const updatedPlayers = [...players];
                updatedPlayers[humanIndex].rack = newRack;

                setTableMelds(filtered);
                setPlayers(updatedPlayers);
                setSelectedTableTile(null);
                notify("牌块已撤回手牌架", "info");
            };

            const nextTurn = (fromTurnIdx, currentPlayers, currentMelds, currentDeck) => {
                if (aiTimeoutRef.current) {
                    clearTimeout(aiTimeoutRef.current);
                    aiTimeoutRef.current = null;
                }

                const nextIdx = (fromTurnIdx + 1) % currentPlayers.length;
                setTurnIndex(nextIdx);
                setSelectedHandTiles([]);
                setSelectedTableTile(null);
                setSelectedMeldIndex(null);
                setTurnActionStack([]);

                const hIdx = currentPlayers.findIndex(p => !p.isComputer);
                const hPlayer = hIdx !== -1 ? currentPlayers[hIdx] : currentPlayers[0];

                setTurnSnapshot({
                    tableMelds: JSON.parse(JSON.stringify(currentMelds)),
                    playerRack: [...hPlayer.rack],
                    deckCount: currentDeck.length
                });

                if (currentPlayers[nextIdx].isComputer) {
                    aiTimeoutRef.current = setTimeout(() => {
                        runAITurn(nextIdx, currentPlayers, currentMelds, currentDeck);
                    }, 1100);
                } else {
                    notify(`轮到你的回合 (${currentPlayers[nextIdx].name})！`, "info");
                }
            };

            // 确认摸牌并撤销本回合
            const handleDrawTileClick = () => {
                if (!isHumanTurn || !humanPlayer) return;

                if (deck.length === 0) {
                    notify("牌库已抽空！游戏结束进行积分结算。", "warning");
                    finalizeGame();
                    return;
                }

                const playedCount = turnSnapshot ? turnSnapshot.playerRack.length - humanPlayer.rack.length : 0;
                const isTableChanged = turnSnapshot && JSON.stringify(tableMelds) !== JSON.stringify(turnSnapshot.tableMelds);

                // 如果本回合已经打出过牌或者改变过桌面牌组，弹出防误触弹窗提醒！
                if (playedCount > 0 || isTableChanged) {
                    setShowDrawConfirmModal(true);
                    return;
                }

                executeDrawTile();
            };

            const executeDrawTile = () => {
                setShowDrawConfirmModal(false);
                resetCurrentTurn();

                sfx.playDraw();
                const newDeck = [...deck];
                const drawn = newDeck.pop();
                const newRack = [...turnSnapshot.playerRack, drawn];

                const updatedPlayers = [...players];
                updatedPlayers[humanIndex] = { ...humanPlayer, rack: newRack };

                setDeck(newDeck);
                setPlayers(updatedPlayers);
                addLog(`${humanPlayer.name} 摸了 1 张牌并结束回合。`);

                nextTurn(turnIndex, updatedPlayers, turnSnapshot.tableMelds, newDeck);
            };

            const submitTurn = () => {
                if (!isHumanTurn || !humanPlayer) return;

                if (humanPlayer.rack.some(t => t.isRetrieved)) {
                    notify("置换出来的百搭牌必须在本回合打到桌面上，不能留在手牌架！", "error");
                    return;
                }

                if (!isEntireTableValid) {
                    notify("桌面上有不合法的牌组（每组必须≥3张且为合法顺组或群组）！", "error");
                    return;
                }

                const playedCount = turnSnapshot.playerRack.length - humanPlayer.rack.length;
                if (playedCount <= 0) {
                    notify("你本回合尚未打出手牌！若无法出牌，请点击「摸牌放弃」。", "warning");
                    return;
                }

                if (!humanPlayer.brokenIce) {
                    const initialIds = new Set(turnSnapshot.tableMelds.flat().map(t => t.id));
                    let icePoints = 0;
                    for (const meld of tableMelds) {
                        const isPureHandMeld = meld.every(t => !initialIds.has(t.id));
                        if (isPureHandMeld) {
                            icePoints += getMeldPoints(meld);
                        }
                    }

                    if (icePoints < 30) {
                        notify(`破冰失败！打出总点数仅 ${icePoints} 点，首次出牌必须 ≥ 30 点！`, "error");
                        return;
                    }

                    const updatedPlayers = [...players];
                    updatedPlayers[humanIndex].brokenIce = true;
                    setPlayers(updatedPlayers);
                    addLog(`🎉 ${humanPlayer.name} 破冰成功！打出 ${icePoints} 点！`);
                    sfx.playSuccess();
                } else {
                    addLog(`${humanPlayer.name} 打出了 ${playedCount} 张牌！`);
                    sfx.playSuccess();
                }

                if (humanPlayer.rack.length === 0) {
                    handleVictory(humanPlayer);
                    return;
                }

                nextTurn(turnIndex, players, tableMelds, deck);
            };

            // 全面重构的 AI 决策引擎：彻底解决任何 AI 玩家不破冰、一直摸牌的漏判 Bug
            const runAITurn = (aiIdx, currentPlayers, currentMelds, currentDeck) => {
                const ai = currentPlayers[aiIdx];
                let newTableMelds = JSON.parse(JSON.stringify(currentMelds));
                let newRack = [...ai.rack];

                // AI 破冰逻辑
                if (!ai.brokenIce) {
                    const allCandidates = findAllCandidateMelds(newRack);
                    const solution = findDisjointMelds(allCandidates, 30);

                    if (solution.points >= 30 && solution.melds.length > 0) {
                        const usedIds = new Set(solution.melds.flat().map(t => t.id));
                        newRack = newRack.filter(t => !usedIds.has(t.id));
                        newTableMelds = [...newTableMelds, ...solution.melds];

                        const updatedPlayers = [...currentPlayers];
                        updatedPlayers[aiIdx] = { ...ai, rack: newRack, brokenIce: true };
                        setPlayers(updatedPlayers);
                        setTableMelds(newTableMelds);
                        addLog(`🎉 🤖 ${ai.name} 破冰成功！打出 ${solution.points} 点！`);

                        if (newRack.length === 0) {
                            handleVictory(ai);
                            return;
                        }
                        nextTurn(aiIdx, updatedPlayers, newTableMelds, currentDeck);
                        return;
                    }
                } else {
                    // 已破冰 AI 出新牌组
                    const allCandidates = findAllCandidateMelds(newRack);
                    if (allCandidates.length > 0) {
                        const bestMeld = [...allCandidates].sort((a, b) => getMeldPoints(b) - getMeldPoints(a))[0];
                        const usedIds = new Set(bestMeld.map(t => t.id));
                        newRack = newRack.filter(t => !usedIds.has(t.id));
                        newTableMelds = [...newTableMelds, bestMeld];

                        const updatedPlayers = [...currentPlayers];
                        updatedPlayers[aiIdx] = { ...ai, rack: newRack };
                        setPlayers(updatedPlayers);
                        setTableMelds(newTableMelds);
                        addLog(`🤖 ${ai.name} 打出了新组合！`);

                        if (newRack.length === 0) {
                            handleVictory(ai);
                            return;
                        }
                        nextTurn(aiIdx, updatedPlayers, newTableMelds, currentDeck);
                        return;
                    }

                    // 追加单张牌到桌面已有组合
                    for (let mIdx = 0; mIdx < newTableMelds.length; mIdx++) {
                        const meld = newTableMelds[mIdx];
                        for (let rIdx = 0; rIdx < newRack.length; rIdx++) {
                            const tile = newRack[rIdx];
                            const inserted = tryInsertTileIntoMeld(meld, tile);
                            if (inserted) {
                                newTableMelds[mIdx] = inserted;
                                newRack.splice(rIdx, 1);
                                const updatedPlayers = [...currentPlayers];
                                updatedPlayers[aiIdx] = { ...ai, rack: newRack };
                                setPlayers(updatedPlayers);
                                setTableMelds(newTableMelds);
                                addLog(`🤖 ${ai.name} 合规追加了牌块到桌面 #${mIdx + 1}！`);

                                if (newRack.length === 0) {
                                    handleVictory(ai);
                                    return;
                                }
                                nextTurn(aiIdx, updatedPlayers, newTableMelds, currentDeck);
                                return;
                            }
                        }
                    }

                    // 追加 2 张牌（例如顺组两端或变色组合）
                    if (newRack.length >= 2) {
                        for (let mIdx = 0; mIdx < newTableMelds.length; mIdx++) {
                            const meld = newTableMelds[mIdx];
                            for (let i = 0; i < newRack.length; i++) {
                                for (let j = i + 1; j < newRack.length; j++) {
                                    const pair = [newRack[i], newRack[j]];
                                    const inserted = tryInsertBatchIntoMeld(meld, pair);
                                    if (inserted) {
                                        newTableMelds[mIdx] = inserted;
                                        const usedIds = new Set(pair.map(t => t.id));
                                        newRack = newRack.filter(t => !usedIds.has(t.id));
                                        const updatedPlayers = [...currentPlayers];
                                        updatedPlayers[aiIdx] = { ...ai, rack: newRack };
                                        setPlayers(updatedPlayers);
                                        setTableMelds(newTableMelds);
                                        addLog(`🤖 ${ai.name} 追加了 2 张手牌到桌面 #${mIdx + 1}！`);

                                        if (newRack.length === 0) {
                                            handleVictory(ai);
                                            return;
                                        }
                                        nextTurn(aiIdx, updatedPlayers, newTableMelds, currentDeck);
                                        return;
                                    }
                                }
                            }
                        }
                    }
                }

                // AI 摸牌逻辑
                if (currentDeck.length > 0) {
                    const freshDeck = [...currentDeck];
                    const drawn = freshDeck.pop();
                    newRack.push(drawn);
                    const updatedPlayers = [...currentPlayers];
                    updatedPlayers[aiIdx] = { ...ai, rack: newRack };
                    setDeck(freshDeck);
                    setPlayers(updatedPlayers);
                    addLog(`🤖 ${ai.name} 思考后摸了 1 张牌。`);
                    nextTurn(aiIdx, updatedPlayers, newTableMelds, freshDeck);
                } else {
                    finalizeGame();
                }
            };

            const handleVictory = (winnerPlayer) => {
                sfx.playSuccess();
                setWinner(winnerPlayer);
                setGameState('end');
                addLog(`🏆 恭喜！${winnerPlayer.name} 清空手牌，赢得 RUMMIKUB 最终胜利！`);
            };

            const finalizeGame = () => {
                const scored = players.map(p => {
                    const sum = p.rack.reduce((acc, t) => {
                        if (t.isJoker) {
                            return acc + (t.jokerType === 'mirror' ? 0 : 30);
                        }
                        return acc + t.value;
                    }, 0);
                    return { ...p, penalty: sum };
                });
                scored.sort((a, b) => a.penalty - b.penalty);
                setWinner(scored[0]);
                setGameState('end');

                                <JokerArt type="regular" color="red" size={68} />
                            </div>
                            <h1 className="text-5xl sm:text-6xl md:text-7xl font-black bg-gradient-to-b from-amber-200 via-amber-400 to-amber-600 bg-clip-text text-transparent tracking-[0.2em] uppercase drop-shadow-2xl text-center leading-none">
                                RUMMIKUB
                            </h1>
                        </div>

                        {/* 入口按钮：高度严格统一 (h-14) */}
                        <div className="relative z-20 flex flex-col sm:flex-row items-center gap-4 w-full max-w-md justify-center">
                            <button 
                                onClick={() => setShowConfig(true)}
                                className="h-14 w-48 sm:w-52 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 rounded-full text-slate-950 font-black text-base sm:text-lg shadow-[0_0_35px_rgba(245,158,11,0.45)] transform transition-all active:scale-95 border-2 border-amber-300/40 whitespace-nowrap flex items-center justify-center"
                            >
                                开始游戏
                            </button>
                            <button
                                onClick={() => setShowRules(true)}
                                className="h-14 w-48 sm:w-52 bg-slate-800/90 hover:bg-slate-750 border-2 border-slate-600 text-slate-200 font-bold text-base sm:text-lg rounded-full transition-all active:scale-95 whitespace-nowrap flex items-center justify-center gap-2 shadow-lg"
                            >
                                <BookOpen size={20} />
                                <span>玩法与置换规则</span>
                            </button>
                        </div>
                        
                        <div className="absolute bottom-4 text-slate-500 text-xs font-mono">
                            Deluxe Twist Edition · Designed for iPad
                        </div>

                        {showConfig && (
                            <ConfigModal 
                                config={config} 
                                setConfig={setConfig} 
                                onStart={() => startNewMatch(config)} 
                                onClose={() => setShowConfig(false)} 
                            />
                        )}

                        {showRules && <RuleModal onClose={() => setShowRules(false)} />}
                    </div>
                );
            }

            const currentRack = currentPlayer?.rack || [];
            const halfIdx = Math.ceil(currentRack.length / 2);
            const rackRow1 = currentRack.slice(0, halfIdx);
            const rackRow2 = currentRack.slice(halfIdx);

            return (
                <div className="h-full w-full bg-[#0b1120] text-slate-100 flex flex-col overflow-hidden font-sans safe-top-padding">
                    {showRules && <RuleModal onClose={() => setShowRules(false)} />}

                    {showConfig && (
                        <ConfigModal
                            config={config}
                            setConfig={setConfig}
                            onStart={() => startNewMatch(config)}
                            onClose={() => setShowConfig(false)}
                        />
                    )}

                    {showLogModal && (
                        <LogModal logs={logs} onClose={() => setShowLogModal(false)} />
                    )}

                    {/* 误触摸牌防呆确认弹窗 */}
                    {showDrawConfirmModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4 animate-pop safe-top-padding">
                            <div className="bg-slate-900 border-2 border-amber-500 rounded-3xl p-6 sm:p-7 max-w-sm w-full shadow-2xl text-center">
                                <div className="p-3 bg-amber-500/20 text-amber-400 rounded-2xl w-fit mx-auto mb-3">
                                    <AlertTriangle size={36} />
                                </div>
                                <h3 className="text-lg font-black text-white mb-2">确认摸牌并撤销出牌？</h3>
                                <p className="text-xs text-slate-300 leading-relaxed mb-6">
                                    检测到您本回合已打出手牌或调整了牌桌。点击摸牌将<b>撤销您本回合的所有操作并重置牌桌</b>，确定要放弃本回合摸一张牌吗？
                                </p>
                                <div className="flex gap-2.5">
                                    <button
                                        onClick={() => setShowDrawConfirmModal(false)}
                                        className="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs"
                                    >
                                        取消，继续出牌
                                    </button>
                                    <button
                                        onClick={executeDrawTile}
                                        className="flex-1 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-black text-xs shadow"

                                        确定撤销并摸牌

                    <div className="h-14 py-1.5 bg-slate-900/95 border-b border-slate-800 px-3 sm:px-4 flex items-center justify-between z-30 shrink-0 shadow-lg gap-2 overflow-x-auto custom-scrollbar">

                    <div className="flex-1 flex overflow-hidden min-h-0 relative felt-table">

                            <div className="flex items-center justify-between mb-2.5 px-1 relative min-h-[32px] shrink-0">
