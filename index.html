                                            onClick={autoMergeLooseTiles}
                                            className="px-2.5 py-1 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-slate-950 rounded-full font-black text-xs shadow-md active:scale-95 transition-all flex items-center gap-1 animate-pulse border border-yellow-300 whitespace-nowrap"
                                            title="自动将桌面零散牌块合并为连号顺组或群组"
                                        >
                                            <Sparkles size={12} />
                                            <span>⚡ 一键合并散牌</span>
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* 牌桌虚线区域：对局全程完整保留虚线外框 */}
                            <div 
                                data-table-area="true"
                                className={`flex-1 border-2 border-dashed rounded-3xl p-3 sm:p-4 overflow-y-auto custom-scrollbar flex flex-col relative backdrop-blur-[2px] transition-colors ${
                                    dragState?.isDragging && dragState?.targetInfo?.type === 'table-new'
                                        ? 'border-yellow-400/80 bg-amber-500/10'
                                        : 'border-slate-700/60 bg-slate-950/20'
                                }`}
                            >
                                {tableMelds.length === 0 ? (
                                    <div className="flex-1 flex flex-col items-center justify-center text-center text-slate-500 py-8 pointer-events-none">
                                        <JokerArt type="regular" color="red" size={56} />
                                        <p className="mt-3 text-base font-bold text-slate-300">公共牌桌暂无牌组</p>
                                        <p className="text-xs text-slate-400 mt-1 max-w-md">
                                            从下方双排牌架选择或直接拖拽卡牌上桌！首次出牌点数需 ≥ 30 点破冰。可随时点击「出牌提示」获取指导！
                                        </p>
                                    </div>
                                ) : (
                                    <div className="flex flex-wrap content-start gap-3 sm:gap-4 pt-14 pb-14">
                                        {tableMelds.map((meld, idx) => (
                                            <TableMeldGroup
                                                key={`meld_${idx}`}
                                                meld={meld}
                                                index={idx}
                                                isSelected={selectedMeldIndex === idx}
                                                selectedTileInfo={selectedTableTile}
                                                initialTableTileIds={initialTableTileIds}
                                                dragState={dragState}
                                                onClick={() => appendSelectedToMeld(idx)}
                                                onTileClick={handleTableTileClick}
                                                onTilePointerDown={handleTilePointerDown}
                                                onMoveInside={moveTileInsideMeld}
                                                onSplit={splitMeldAtSelectedTile}
                                                onExtract={extractTileToNewMeld}
                                                onSubstitute={substituteTableJoker}
                                                onTakeBack={takeBackToHand}
                                                onDeselectTile={() => setSelectedTableTile(null)}
                                                canSubstitute={canCurrentJokerBeSubstituted}
                                            />
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* 底部木质牌架 */}
                    {(() => {
                        const humanRack = humanPlayer?.rack || [];
                        const halfIdx = Math.ceil(humanRack.length / 2);
                        const rackRow1 = humanRack.slice(0, halfIdx);
                        const rackRow2 = humanRack.slice(halfIdx);

                        return (
                            <div 
                                data-rack-zone="true"
                                className={`h-60 sm:h-64 wood-rack flex flex-col p-2.5 z-40 shrink-0 shadow-2xl transition-all ${
                                    dragState?.isDragging && dragState?.targetInfo?.type === 'rack'
                                        ? 'ring-4 ring-amber-400 bg-amber-950/30'
                                        : ''
                                }`}
                            >
                                <div className="flex items-center justify-between px-2 mb-1.5 overflow-x-auto custom-scrollbar">
                                    <div className="flex items-center gap-2 shrink-0 whitespace-nowrap">
                                        <span className="text-xl">{humanPlayer?.avatar}</span>
                                        <span className="font-black text-sm text-amber-200">{humanPlayer?.name} (我的手牌)</span>
                                        <span className={`text-[11px] px-2 py-0.5 rounded-full font-bold ${
                                            humanPlayer?.brokenIce 
                                                ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' 
                                                : 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                                        }`}>
                                            {humanPlayer?.brokenIce ? '已破冰 (自由重组/置换)' : '未破冰 (首出需 ≥ 30分)'}
                                        </span>
                                        <span className="text-xs text-slate-400 ml-1">
                                            手牌: <b className="text-white">{humanPlayer?.rack.length}</b> 张
                                        </span>

                                        {!isHumanTurn && currentPlayer && (
                                            <span className="text-xs font-bold text-amber-400 bg-amber-950/80 border border-amber-500/50 px-2.5 py-0.5 rounded-full animate-pulse ml-2 flex items-center gap-1.5">
                                                <span>⏳</span> 等待 {currentPlayer.name} 思考行动...
                                            </span>
                                        )}
                                    </div>

                                    <div className="flex items-center gap-1.5 shrink-0 whitespace-nowrap">
                                        <button
                                            onClick={provideMoveHint}
                                            disabled={!isHumanTurn}
                                            className="px-2.5 py-1 bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-400 hover:to-amber-400 text-slate-950 font-black rounded-lg text-xs shadow flex items-center gap-1 active:scale-95 transition-all disabled:opacity-40 whitespace-nowrap border border-yellow-300"
                                            title="智能分析手牌与桌面，给出最佳出牌或追加方案"
                                        >
                                            <Sparkles size={13} className="text-slate-950" />
                                            <span>💡 出牌提示</span>
                                        </button>

                                        <button
                                            onClick={smartGroupForBeginners}
                                            className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/40 rounded-lg text-xs font-bold flex items-center gap-1 active:scale-95 transition-all whitespace-nowrap"
                                            title="自动识别手牌中的顺组与群组并置于上排"
                                        >
                                            <Lightbulb size={13} />
                                            <span>智能理牌</span>
                                        </button>

                                        <button
                                            onClick={sortRackByNumber}
                                            className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg text-xs font-bold active:scale-95 whitespace-nowrap"
                                        >
                                            按大小 (777)
                                        </button>
                                        <button
                                            onClick={sortRackByColor}
                                            className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg text-xs font-bold active:scale-95 whitespace-nowrap"
                                        >
                                            按颜色 (123)
                                        </button>

                                        <button
                                            onClick={undoLastStep}
                                            disabled={!isHumanTurn || turnActionStack.length === 0}
                                            className="px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-white border border-amber-400 rounded-lg text-xs font-bold flex items-center gap-1 active:scale-95 disabled:opacity-40 whitespace-nowrap shadow"
                                            title="撤销上一次出牌、拼牌或置换操作"
                                        >
                                            <Undo2 size={13} />
                                            <span>撤销上一步 ({turnActionStack.length})</span>
                                        </button>

                                        <button
                                            onClick={resetCurrentTurn}
                                            disabled={!isHumanTurn}
                                            className="px-2 py-1 bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-800/80 rounded-lg text-xs font-bold flex items-center gap-1 active:scale-95 disabled:opacity-30 whitespace-nowrap"
                                        >
                                            <RotateCcw size={11} />
                                            <span>重置回合</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="flex-1 flex gap-2 overflow-hidden">
                                    <div className="flex-1 flex flex-col justify-between gap-1.5 overflow-hidden">
                                        {/* 上阶梯 (Row 1) */}
                                        <div className="rack-step flex-1 rounded-xl p-1.5 flex items-center gap-1.5 overflow-x-auto custom-scrollbar">
                                            <div className="px-1 text-[9px] text-amber-500/70 font-mono select-none uppercase font-bold shrink-0">
                                                上排
                                            </div>
                                            {rackRow1.map((tile, rIdx) => {
                                                const isDraggingThis = dragState?.isDragging && dragState?.sourceInfo?.type === 'hand' && dragState?.tile?.id === tile.id;
                                                return (
                                                    <Tile
                                                        key={tile.id}
                                                        tile={tile}
                                                        size="md"
                                                        isDragging={isDraggingThis}
                                                        isSelected={selectedHandTiles.some(t => t.id === tile.id)}
                                                        onPointerDown={(e) => handleTilePointerDown(e, tile, { type: 'hand', tileIndex: rIdx })}
                                                        onClick={() => toggleSelectHandTile(tile)}
                                                    />
                                                );
                                            })}
                                            {rackRow1.length === 0 && (
                                                <div className="text-xs text-slate-600 italic px-4">空</div>
                                            )}
                                        </div>

                                        {/* 下阶梯 (Row 2) */}
                                        <div className="rack-step flex-1 rounded-xl p-1.5 flex items-center gap-1.5 overflow-x-auto custom-scrollbar">
                                            <div className="px-1 text-[9px] text-amber-500/70 font-mono select-none uppercase font-bold shrink-0">
                                                下排
                                            </div>
                                            {rackRow2.map((tile, rIdx) => {
                                                const actualIndex = halfIdx + rIdx;
                                                const isDraggingThis = dragState?.isDragging && dragState?.sourceInfo?.type === 'hand' && dragState?.tile?.id === tile.id;
                                                return (
                                                    <Tile
                                                        key={tile.id}
                                                        tile={tile}
                                                        size="md"
                                                        isDragging={isDraggingThis}
                                                        isSelected={selectedHandTiles.some(t => t.id === tile.id)}
                                                        onPointerDown={(e) => handleTilePointerDown(e, tile, { type: 'hand', tileIndex: actualIndex })}
                                                        onClick={() => toggleSelectHandTile(tile)}
                                                    />
                                                );
                                            })}
                                            {rackRow2.length === 0 && (
                                                <div className="text-xs text-slate-600 italic px-4">空</div>
                                            )}
                                        </div>
                                    </div>

                                    {/* 出牌确认 / 摸牌放弃 */}
                                    <div className="w-40 sm:w-48 flex flex-col justify-between gap-1.5 shrink-0 pl-2 border-l border-amber-900/40">
                                        <button
                                            onClick={playSelectedAsNewMeld}
                                            disabled={!isHumanTurn || selectedHandTiles.length === 0}
                                            className="flex-1 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 font-black rounded-xl text-xs sm:text-sm shadow-md active:scale-95 transition-all disabled:opacity-40 flex items-center justify-center gap-1 text-center p-1 whitespace-nowrap"
                                        >
                                            <PlusCircle size={15} />
                                            <span>作为新牌组打出 ({selectedHandTiles.length})</span>
                                        </button>

                                        <div className="flex gap-1.5 flex-1">
                                            <button
                                                onClick={handleDrawTileClick}
                                                disabled={!isHumanTurn}
                                                className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-xl text-xs font-bold active:scale-95 transition-all disabled:opacity-40 flex flex-col items-center justify-center gap-0.5 whitespace-nowrap"
                                            >
                                                <ArrowDown size={14} />
                                                <span>摸牌放弃</span>
                                            </button>
                                            <button
                                                onClick={submitTurn}
                                                disabled={!isHumanTurn}
                                                className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-xs sm:text-sm shadow-lg shadow-emerald-950 active:scale-95 transition-all disabled:opacity-40 flex flex-col items-center justify-center gap-0.5 whitespace-nowrap"
                                            >
                                                <Check size={16} />
                                                <span>确认出牌</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* 悬浮跟随手指/鼠标的拖拽卡牌克隆体 */}
                    {dragState && dragState.isDragging && (
                        <div 
                            className="fixed pointer-events-none z-[100] transform -translate-x-1/2 -translate-y-1/2 scale-110 rotate-3 transition-transform"
                            style={{ left: dragState.x, top: dragState.y }}
                        >
                            <Tile 
                                tile={dragState.tile} 
                                size="md" 
                                customClass="shadow-[0_16px_36px_rgba(0,0,0,0.7)] ring-4 ring-yellow-400" 
                            />
                        </div>
                    )}

                    {/* 结算弹窗 (Game Over Modal) */}
                    {gameState === 'end' && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md p-4 animate-pop safe-top-padding">
                            <div className="bg-slate-900 border-2 border-amber-500/40 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-[0_0_60px_rgba(0,0,0,0.8)] text-center">
                                <div className="text-5xl mb-3">🏆</div>
                                <h2 className="text-2xl font-black text-amber-400 mb-1">
                                    {winner?.name} 获得胜利！
                                </h2>
                                <p className="text-xs text-slate-400 mb-4">
                                    对局结束，最终胜者诞生！
                                </p>
                                <div className="bg-slate-950/60 rounded-xl p-3 mb-5 border border-slate-800 space-y-2 text-left">
                                    <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">
                                        手牌结算扣分
                                    </div>
                                    {players.map(p => {
                                        const sum = p.rack.reduce((a, t) => {
                                            if (t.isJoker) return a + (t.jokerType === 'mirror' ? 0 : 30);
                                            return a + t.value;
                                        }, 0);
                                        return (
                                            <div key={p.id} className="flex justify-between items-center text-xs">
                                                <span className="font-bold text-slate-200 flex items-center gap-1.5">
                                                    <span>{p.avatar}</span> {p.name}
                                                </span>
                                                <span className="font-mono text-slate-400">
                                                    剩余 {p.rack.length} 张牌 ({p.rack.length === 0 ? '🏆 0分 (胜者)' : `-${sum}分`})
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setGameState('setup')}
                                        className="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl text-sm border border-slate-700 whitespace-nowrap"
                                    >
                                        返回主页
                                    </button>
                                    <button
                                        onClick={() => startNewMatch(config)}
                                        className="flex-[2] py-3 bg-gradient-to-r from-amber-500 to-yellow-600 text-slate-950 font-black rounded-xl text-sm shadow-xl active:scale-95 whitespace-nowrap"
                                    >
                                        再来一局
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RummikubGame />);
    </script>
</body>
</html>
